[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instaply"
version = "0.1.0"
description = "A free, local-first AI agent that fills out and submits job applications for you."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Instaply Contributors", email = "support@asion.ai" }
]
keywords = ["job-application", "automation", "playwright", "ats", "mcp", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]

dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  "pydantic>=2.9",
  "playwright>=1.48",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "openai>=1.54",          # works against NIM, OpenAI, and any OAI-compat endpoint
  "tenacity>=9.0",
  "httpx>=0.27",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.149",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
]

[project.urls]
Homepage      = "https://instaply.asion.ai"
Documentation = "https://instaply.asion.ai"
Issues        = "https://github.com/Aditya-00a/Instaply/issues"
Source        = "https://github.com/Aditya-00a/Instaply"

[project.scripts]
instaply = "instaply.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["instaply"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "agent/artifacts",
  "agent/data",
  "agent/backend/static",
  "node_modules",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Stay close to flake8's default useful subset. The full ruff ruleset is
# noisy on a research-y codebase like this; we'll tighten over time.
select = ["E", "F", "W"]
ignore = [
  "E701",  # multiple statements on one line — used in tiny one-line helpers (bold/green/red)
  "E702",  # statement separated by colons — same
  "E501",  # line too long — handled by formatter, not worth blocking PRs on
  "F841",  # unused local variable — useful but mostly captures intentional debug bindings
]

[tool.ruff.lint.per-file-ignores]
# These entry-point scripts deliberately munge sys.path before importing
# from `backend.*`, which trips E402.
"agent/run.py"           = ["E402"]
"agent/apply_now.py"     = ["E402"]
"agent/find_wd_job.py"   = ["E402"]
"agent/jobspy_search.py" = ["E402"]
"agent/setup.py"         = ["E402"]
"agent/profile_wizard.py" = ["E402"]
"agent/doctor.py"        = ["E402"]
"agent/resume_parser.py" = ["E402"]
# Other entry points that munge sys.path
"api/app/main.py"        = ["E402"]
"agent/backend/services/review_commands.py" = ["E402"]
# Tests sometimes import fixtures or assert against module imports.
"tests/**/*.py"          = ["F401", "F811", "E402"]
"worker/tests/**/*.py"   = ["F401", "F811", "E402"]
"api/tests/**/*.py"      = ["F401", "F811", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
