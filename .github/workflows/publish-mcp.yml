name: Publish Instaply MCP

# Triggers on any tag matching `v*` (e.g. v0.4.3, v1.0.0).
# Bump version → tag → push tag → this workflow does everything:
#   1. Builds the wheel + sdist
#   2. Builds the .mcpb bundle (Anthropic's one-click install format)
#   3. Publishes the wheel/sdist to PyPI via Trusted Publishing (no token needed)
#   4. Uploads the .mcpb to a GitHub Release for stable URL hosting
#
# Setup (one-time):
#   1. On https://pypi.org/manage/account/publishing/ add a "pending publisher":
#        Owner:    Aditya-00a
#        Repo:     Instaply
#        Workflow: publish-mcp.yml
#        Env:      pypi
#      (No env name needed if you don't want one.)
#   2. After the first publish, PyPI will recognize the GitHub project.
#   3. That's it. No tokens to copy or rotate.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          ver=$(grep '^version' mcp/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building version $ver"

      - name: Sanity-check tag matches version
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          src_ver="${{ steps.version.outputs.version }}"
          if [ "$tag_ver" != "$src_ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject version $src_ver"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install --upgrade build hatchling

      - name: Build wheel + sdist
        working-directory: mcp
        run: |
          rm -rf dist build
          python -m build

      - name: Set up Node (for mcpb CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Stage bundle dir for mcpb pack
        working-directory: mcp
        run: |
          rm -rf bundle
          mkdir -p bundle/lib
          # Install the freshly-built wheel + minimal runtime deps into bundle/lib
          # (matches the local build process documented in mcp/README.md)
          python -m pip install --target bundle/lib --no-cache-dir --no-deps --quiet \
            "dist/instaply_mcp-${{ steps.version.outputs.version }}-py3-none-any.whl"
          python -m pip install --target bundle/lib --no-cache-dir --no-deps --quiet \
            "mcp>=1.2.0" "pydantic>=2.8.0" "pydantic-core" "annotated-types" "typing-extensions" \
            "beautifulsoup4>=4.12.0" "soupsieve" "lxml>=5.2.0" \
            "anyio" "sniffio" "idna" "h11" "certifi" "httpx" "httpcore" \
            "starlette" "pydantic-settings" "python-dotenv" "click" "PyPDF2"
          # Slim caches
          find bundle/lib -name '__pycache__' -type d -exec rm -rf {} + || true
          find bundle/lib -name '*.dist-info' -type d -exec rm -rf {} + || true
          cp manifest.json bundle/manifest.json
          # Re-create the placeholder icon (the real one will replace this later)
          if [ ! -f bundle/icon.png ]; then
            python -c "import struct, zlib; \
              sig=b'\x89PNG\r\n\x1a\n'; \
              chunk=lambda t,d: __import__('struct').pack('>I',len(d))+t+d+__import__('struct').pack('>I',zlib.crc32(t+d)&0xffffffff); \
              ihdr=chunk(b'IHDR', struct.pack('>IIBBBBB',128,128,8,2,0,0,0)); \
              raw=b''; \
              [raw:=(raw + b'\x00' + bytes((255,214,90))*128) for _ in range(128)]; \
              idat=chunk(b'IDAT', zlib.compress(raw,9)); \
              iend=chunk(b'IEND', b''); \
              open('bundle/icon.png','wb').write(sig+ihdr+idat+iend)"
          fi

      - name: Pack .mcpb bundle
        working-directory: mcp
        run: mcpb pack bundle dist/instaply.mcpb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mcp/dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing — no PyPI token needed. Configure once at
    # https://pypi.org/manage/account/publishing/
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/instaply-mcp
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: mcp/dist/

      - name: Publish wheel + sdist to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp/dist/
          # Skip files that are already on PyPI (idempotent re-runs)
          skip-existing: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: mcp/dist/

      - name: Create GitHub Release with .mcpb attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Instaply MCP ${{ github.ref_name }}
          body: |
            One-click install for Claude Desktop:

            **Download:** [`instaply.mcpb`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/instaply.mcpb)

            Install via PyPI (Claude Code, Codex, Cursor, etc.):
            ```bash
            pip install instaply-mcp==${{ needs.build.outputs.version }}
            ```

            Or from the project's stable URL (always-latest):
            ```bash
            pip install https://instaply.asion.ai/instaply.whl
            ```
          files: |
            mcp/dist/instaply.mcpb
            mcp/dist/instaply_mcp-*.whl
            mcp/dist/instaply_mcp-*.tar.gz
          generate_release_notes: true
