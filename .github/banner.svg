<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Instaply — a free, local-first job-application agent for students">
  <defs>
    <!-- Gradient mesh background -->
    <radialGradient id="g1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5f8cff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="55%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="wm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e9eff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5f8cff"/>
      <animate attributeName="x1" from="-50%" to="50%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="50%" to="150%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#g1)"/>
  <rect width="1280" height="360" fill="url(#g2)"/>
  <rect width="1280" height="360" fill="url(#g3)"/>

  <!-- Floating geometric accents -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="6" fill="#5f8cff">
      <animate attributeName="cy" values="80;72;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="280" r="5" fill="#a78bfa">
      <animate attributeName="cy" values="280;272;280" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="60" r="4" fill="#60a5fa">
      <animate attributeName="cy" values="60;52;60" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="290" r="7" fill="#a78bfa" opacity="0.7">
      <animate attributeName="cy" values="290;282;290" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="1080" y="120" width="14" height="14" fill="none" stroke="#5f8cff" stroke-width="1.5" transform="rotate(20 1087 127)">
      <animateTransform attributeName="transform" type="rotate" from="0 1087 127" to="360 1087 127" dur="20s" repeatCount="indefinite"/>
    </rect>
    <polygon points="180,200 195,220 165,220" fill="none" stroke="#a78bfa" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0 180 213" to="360 180 213" dur="18s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Wordmark -->
  <g transform="translate(640 168)" text-anchor="middle">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-weight="800" font-size="112" letter-spacing="-0.04em" fill="url(#wm)">
      instaply
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(640 230)" text-anchor="middle">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-weight="500" font-size="22" letter-spacing="0.01em" fill="#cdd5e0">
      a free, local-first, open-source job-application agent
    </text>
  </g>

  <!-- Pill chips -->
  <g transform="translate(640 285)" text-anchor="middle">
    <g transform="translate(-235 0)">
      <rect x="-92" y="-15" width="184" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="0" y="5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#9aa5b8">$ python setup.py</text>
    </g>
    <g transform="translate(-30 0)">
      <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="0" y="5" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#cdd5e0">MIT License</text>
    </g>
    <g transform="translate(105 0)">
      <rect x="-78" y="-15" width="156" height="30" rx="15" fill="#5f8cff" fill-opacity="0.18" stroke="#5f8cff" stroke-opacity="0.45"/>
      <text x="0" y="5" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#cdd5e0">Runs while you sleep</text>
    </g>
    <g transform="translate(245 0)">
      <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#22c55e" fill-opacity="0.18" stroke="#22c55e" stroke-opacity="0.45"/>
      <text x="0" y="5" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#cdd5e0">Free forever</text>
    </g>
  </g>
</svg>
