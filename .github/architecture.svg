<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Instaply architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0807"/>
      <stop offset="100%" stop-color="#14100e"/>
    </linearGradient>
    <linearGradient id="mcp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="agent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c98a"/>
      <stop offset="100%" stop-color="#d49b5b"/>
    </linearGradient>
    <linearGradient id="store-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1612"/>
      <stop offset="100%" stop-color="#0f0a08"/>
    </linearGradient>
    <linearGradient id="boundary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4c98a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f4c98a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f4c98a" stop-opacity="0.3"/>
    </linearGradient>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4c98a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6155"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <text x="640" y="44" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-weight="400" font-size="26" fill="#f4ede0">
    How Instaply works
  </text>
  <text x="640" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-weight="400" font-size="13" fill="#b8ad9d">
    Two ways in, one engine, everything on your laptop. No servers in the loop.
  </text>

  <!-- "Your machine" boundary box -->
  <rect x="40" y="105" width="1200" height="455" rx="20"
        fill="none" stroke="url(#boundary-grad)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="80" y="92" width="160" height="26" rx="13" fill="#0a0807"/>
  <text x="160" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="11" font-weight="500" letter-spacing="0.12em" fill="#f4c98a">
    YOUR LAPTOP
  </text>

  <!-- ─────────── PATH 1: MCP MODE (left half) ─────────── -->

  <!-- User talks to Claude -->
  <g transform="translate(80 145)">
    <rect width="240" height="70" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#475569" stroke-width="1"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">You + Claude (chat)</text>
    <text x="120" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8a8175">"apply to this Greenhouse role"</text>
  </g>

  <!-- MCP server -->
  <g transform="translate(80 245)">
    <rect width="240" height="76" rx="14" fill="url(#mcp-grad)" opacity="0.95"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#0a0807">MCP Server</text>
    <text x="120" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0a0807" opacity="0.85">instaply-mcp</text>
    <text x="120" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#0a0807" opacity="0.7">12 tools · stdio · per-job, on demand</text>
  </g>

  <!-- Compatible clients -->
  <g transform="translate(80 348)">
    <rect width="240" height="58" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#3a3530" stroke-dasharray="3 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#a78bfa">CLIENTS</text>
    <text x="120" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Claude Desktop · Claude Code · Cursor</text>
    <text x="120" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Codex CLI · Windsurf · Zed</text>
  </g>

  <!-- Arrow user → MCP -->
  <line x1="200" y1="215" x2="200" y2="245" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ─────────── PATH 2: AUTONOMOUS MODE (right half) ─────────── -->

  <!-- Scheduled task / setup wizard -->
  <g transform="translate(960 145)">
    <rect width="240" height="70" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#475569" stroke-width="1"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">You (one-time setup)</text>
    <text x="120" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8175">$ python setup.py</text>
  </g>

  <!-- Autonomous loop -->
  <g transform="translate(960 245)">
    <rect width="240" height="76" rx="14" fill="url(#agent-grad)" opacity="0.95"/>
    <text x="120" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#0a0807">Autonomous Loop</text>
    <text x="120" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0a0807" opacity="0.85">agent/run.py</text>
    <text x="120" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#0a0807" opacity="0.7">discover → score → queue · scheduled</text>
  </g>

  <!-- Schedulers / runtime -->
  <g transform="translate(960 348)">
    <rect width="240" height="58" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#3a3530" stroke-dasharray="3 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#f4c98a">RUNTIME</text>
    <text x="120" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Windows Task Scheduler · launchd · cron</text>
    <text x="120" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">+ watchdog (auto-restart)</text>
  </g>

  <!-- Arrow user → autonomous -->
  <line x1="1080" y1="215" x2="1080" y2="245" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- ─────────── SHARED ENGINE (center) ─────────── -->

  <g transform="translate(390 230)">
    <rect width="500" height="100" rx="16" fill="#1e1612" stroke="#f4c98a" stroke-width="1.5"/>
    <text x="250" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#f4ede0">Shared Engine</text>
    <text x="250" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#b8ad9d">39 deterministic field rules · LLM fallback for the gnarly ones</text>
    <text x="250" y="78" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#b8ad9d">ATS adapters: Greenhouse · Lever · SmartRecruiters</text>
  </g>

  <!-- Arrow MCP → Engine -->
  <line x1="320" y1="280" x2="390" y2="280" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <!-- Arrow Autonomous → Engine -->
  <line x1="960" y1="280" x2="890" y2="280" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-purple)" marker-start="url(#arrow-amber)"/>

  <!-- ─────────── ACTUATOR (Playwright) ─────────── -->

  <g transform="translate(390 360)">
    <rect width="500" height="80" rx="14" fill="#0f0a08" stroke="#3a3530"/>
    <text x="250" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">Playwright (your real Chromium)</text>
    <text x="250" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8a8175">your IP · your cookies · your session — captcha walls don't fire</text>
    <text x="250" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">pauses for you to solve captcha + click final Submit</text>
  </g>

  <!-- Arrow Engine → Playwright -->
  <line x1="640" y1="330" x2="640" y2="360" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- ─────────── ATS (the destination, outside laptop) ─────────── -->

  <g transform="translate(390 470)">
    <rect width="500" height="58" rx="12" fill="none" stroke="#475569" stroke-dasharray="6 4"/>
    <text x="250" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#94a3b8">EMPLOYER ATS (outside your laptop)</text>
    <text x="250" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">boards.greenhouse.io · jobs.lever.co · jobs.smartrecruiters.com · careers.workday.com (beta)</text>
  </g>

  <!-- Arrow Playwright → ATS (crosses boundary) -->
  <line x1="640" y1="440" x2="640" y2="470" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- ─────────── LOCAL STORE (left bottom corner) ─────────── -->

  <g transform="translate(80 440)">
    <rect width="240" height="100" rx="14" fill="url(#store-grad)" stroke="#a78bfa" stroke-width="1"/>
    <text x="120" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a78bfa">~/.instaply/data.db</text>
    <text x="120" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">profile · saved answers · job cache</text>
    <text x="120" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">application history · audit trail</text>
    <line x1="20" y1="74" x2="220" y2="74" stroke="#3a3530" stroke-width="0.5"/>
    <text x="120" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">one local SQLite file. delete to reset.</text>
  </g>

  <!-- Engine ↔ Store arrows -->
  <line x1="390" y1="320" x2="290" y2="440" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>

  <!-- ─────────── LOCAL LLM (right bottom corner) ─────────── -->

  <g transform="translate(960 440)">
    <rect width="240" height="100" rx="14" fill="url(#store-grad)" stroke="#f4c98a" stroke-width="1"/>
    <text x="120" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4c98a">Local LLM</text>
    <text x="120" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Ollama (default) — auto-picked</text>
    <text x="120" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">3B / 7B / 14B / 30B per your hardware</text>
    <line x1="20" y1="74" x2="220" y2="74" stroke="#3a3530" stroke-width="0.5"/>
    <text x="120" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">or BYO key for OpenAI / Anthropic</text>
  </g>

  <!-- Engine ↔ LLM arrows -->
  <line x1="890" y1="320" x2="990" y2="440" stroke="#f4c98a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>

  <!-- Footer note -->
  <text x="640" y="600" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6a6155">
    No Instaply server. No telemetry. No accounts. MIT licensed.
  </text>
</svg>
