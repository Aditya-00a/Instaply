<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-label="Instaply architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0807"/>
      <stop offset="100%" stop-color="#14100e"/>
    </linearGradient>
    <linearGradient id="setup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="loop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c98a"/>
      <stop offset="100%" stop-color="#d49b5b"/>
    </linearGradient>
    <linearGradient id="store-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1612"/>
      <stop offset="100%" stop-color="#0f0a08"/>
    </linearGradient>
    <linearGradient id="boundary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4c98a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f4c98a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f4c98a" stop-opacity="0.3"/>
    </linearGradient>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f4c98a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1280" height="680" fill="url(#bg)" rx="20"/>

  <!-- Title -->
  <text x="640" y="44" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-weight="400" font-size="26" fill="#f4ede0">
    How Instaply works
  </text>
  <text x="640" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-weight="400" font-size="13" fill="#b8ad9d">
    One setup. A loop that runs while you sleep. Everything on your laptop.
  </text>

  <!-- "Your machine" boundary box -->
  <rect x="40" y="105" width="1200" height="495" rx="20"
        fill="none" stroke="url(#boundary-grad)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="80" y="92" width="160" height="26" rx="13" fill="#0a0807"/>
  <text x="160" y="110" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-size="11" font-weight="500" letter-spacing="0.12em" fill="#f4c98a">
    YOUR LAPTOP
  </text>

  <!-- ─────────── ROW 1: ONE-TIME SETUP ─────────── -->

  <g transform="translate(80 145)">
    <rect width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#475569" stroke-width="1"/>
    <text x="110" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">You (once)</text>
    <text x="110" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8175">$ python setup.py</text>
    <text x="110" y="71" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">~60 seconds</text>
  </g>

  <g transform="translate(340 145)">
    <rect width="240" height="80" rx="14" fill="url(#setup-grad)" opacity="0.95"/>
    <text x="120" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#0a0807">Setup wizard</text>
    <text x="120" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0a0807" opacity="0.85">detect HW · install Ollama</text>
    <text x="120" y="70" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#0a0807" opacity="0.85">pick model · write .env</text>
  </g>

  <g transform="translate(620 145)">
    <rect width="240" height="80" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#3a3530" stroke-dasharray="3 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#a78bfa">SCHEDULER</text>
    <text x="120" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Windows Task Scheduler</text>
    <text x="120" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">launchd · cron</text>
    <text x="120" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">+ watchdog (auto-restart)</text>
  </g>

  <g transform="translate(900 145)">
    <rect width="240" height="80" rx="14" fill="#ffffff" fill-opacity="0.03" stroke="#3a3530" stroke-dasharray="3 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.08em" fill="#f4c98a">YOU (drop in)</text>
    <text x="120" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#b8ad9d">data/profile.json</text>
    <text x="120" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#b8ad9d">data/master-resume.json</text>
    <text x="120" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">your identity + experience</text>
  </g>

  <!-- Setup arrows -->
  <line x1="300" y1="185" x2="340" y2="185" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="580" y1="185" x2="620" y2="185" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ─────────── ROW 2: AUTONOMOUS LOOP (the heart) ─────────── -->

  <g transform="translate(390 270)">
    <rect width="500" height="100" rx="16" fill="url(#loop-grad)" opacity="0.95"/>
    <text x="250" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#0a0807">Autonomous Loop</text>
    <text x="250" y="56" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0a0807" opacity="0.85">agent/run.py · wakes on schedule</text>
    <text x="250" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#0a0807" opacity="0.8">discover → score → tailor → queue</text>
  </g>

  <!-- Arrow scheduler -> loop -->
  <line x1="740" y1="225" x2="640" y2="270" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- ─────────── ROW 3: ENGINE COMPONENTS (3 across) ─────────── -->

  <g transform="translate(80 405)">
    <rect width="350" height="90" rx="14" fill="#1e1612" stroke="#3a3530"/>
    <text x="175" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">Discovery</text>
    <text x="175" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Greenhouse · Lever · SmartRecruiters</text>
    <text x="175" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">Workday (beta) · JobSpy aggregators</text>
    <text x="175" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">scans curated slug pools per cycle</text>
  </g>

  <g transform="translate(465 405)">
    <rect width="350" height="90" rx="14" fill="#1e1612" stroke="#f4c98a" stroke-width="1.5"/>
    <text x="175" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">Scoring + tailoring</text>
    <text x="175" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">39 deterministic field rules</text>
    <text x="175" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">+ local-LLM fallback for ambiguous fits</text>
    <text x="175" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6a6155">re-ranks resume bullets per JD</text>
  </g>

  <g transform="translate(850 405)">
    <rect width="350" height="90" rx="14" fill="#1e1612" stroke="#3a3530"/>
    <text x="175" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#f4ede0">Playwright (your real Chrome)</text>
    <text x="175" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">your IP · your cookies · your session</text>
    <text x="175" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">23+ form-field types autofilled</text>
    <text x="175" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#f4c98a">pauses for captcha + your final Submit</text>
  </g>

  <!-- Loop -> engine arrows -->
  <line x1="500" y1="370" x2="255" y2="405" stroke="#f4c98a" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <line x1="640" y1="370" x2="640" y2="405" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="780" y1="370" x2="1025" y2="405" stroke="#f4c98a" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- ─────────── ROW 4: STORE + LLM ─────────── -->

  <g transform="translate(80 525)">
    <rect width="350" height="60" rx="12" fill="url(#store-grad)" stroke="#a78bfa" stroke-width="1"/>
    <text x="175" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a78bfa">~/.instaply/data.db · agent/data/</text>
    <text x="175" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">queue · saved answers · audit trail · screenshots</text>
  </g>

  <g transform="translate(850 525)">
    <rect width="350" height="60" rx="12" fill="url(#store-grad)" stroke="#f4c98a" stroke-width="1"/>
    <text x="175" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#f4c98a">Local LLM (Ollama)</text>
    <text x="175" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#b8ad9d">3B / 7B / 14B / 30B per your hardware</text>
  </g>

  <!-- Bidirectional arrows: engine ↔ store, engine ↔ LLM -->
  <line x1="465" y1="495" x2="350" y2="525" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
  <line x1="815" y1="495" x2="930" y2="525" stroke="#f4c98a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" marker-start="url(#arrow-amber)"/>

  <!-- ─────────── EMPLOYER ATS (outside laptop) ─────────── -->

  <g transform="translate(390 625)">
    <rect width="500" height="40" rx="10" fill="none" stroke="#475569" stroke-dasharray="6 4"/>
    <text x="250" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">EMPLOYER ATS (outside your laptop)  ·  greenhouse · lever · smartrecruiters</text>
  </g>

  <!-- Playwright -> ATS (crosses boundary) -->
  <line x1="1025" y1="495" x2="780" y2="625" stroke="#f4c98a" stroke-width="2" marker-end="url(#arrow-amber)"/>
</svg>
