<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="Instaply setup wizard demo">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="40" y="30" width="820" height="400" rx="14" fill="url(#term-bg)" stroke="#1f2937" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="40" y="30" width="820" height="38" rx="14" fill="#161b22"/>
    <rect x="40" y="50" width="820" height="18" fill="#161b22"/>
    <line x1="40" y1="68" x2="860" y2="68" stroke="#21262d" stroke-width="1"/>
    <circle cx="65" cy="49" r="6" fill="#ff5f57"/>
    <circle cx="85" cy="49" r="6" fill="#febc2e"/>
    <circle cx="105" cy="49" r="6" fill="#28c840"/>
    <text x="450" y="54" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7d8590">~/Instaply/agent — python setup.py</text>

    <!-- Body -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
      <text x="65" y="100" fill="#5f8cff" font-weight="700">$ </text>
      <text x="83" y="100" fill="#e6edf3">python setup.py</text>

      <text x="65" y="128" fill="#a78bfa" font-weight="700">Instaply Agent setup</text>

      <text x="65" y="158" fill="#7ee787" font-weight="700">Detected hardware:</text>
      <text x="80" y="178" fill="#c9d1d9">  OS:   macOS 14.4 (arm64)</text>
      <text x="80" y="195" fill="#c9d1d9">  CPU:  Apple M3 Max (16 cores)</text>
      <text x="80" y="212" fill="#c9d1d9">  RAM:  36.0 GB</text>
      <text x="80" y="229" fill="#c9d1d9">  GPU:  Apple Apple M3 Max (unified memory)</text>
      <text x="80" y="246" fill="#7d8590">  → usable memory budget for LLM: 36.0 GB</text>

      <text x="65" y="276" fill="#7ee787" font-weight="700">Recommended model:</text>
      <text x="80" y="296" fill="#7ee787">  Qwen3-Coder 30B</text>
      <text x="80" y="313" fill="#c9d1d9"> (qwen3-coder:30b)</text>
      <text x="80" y="330" fill="#7d8590">  Quality: best · Pull size: ~19 GB · Needs ~32 GB free</text>

      <text x="65" y="360" fill="#7ee787" font-weight="700">LLM runtime:</text>
      <text x="80" y="380" fill="#fbbf24">  Ollama is not installed.</text>
      <text x="80" y="397" fill="#c9d1d9">  Install command: </text>
      <text x="245" y="397" fill="#a78bfa" font-weight="700">brew install --cask ollama</text>
      <text x="80" y="414" fill="#c9d1d9">  Install Ollama now? [</text>
      <text x="240" y="414" fill="#7ee787" font-weight="700">y</text>
      <text x="247" y="414" fill="#c9d1d9">/n]: </text>
      <rect x="293" y="404" width="9" height="14" fill="#e6edf3">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
