<!DOCTYPE html>
<!-- Trimmed Greenhouse application form, structure-accurate to what boards.greenhouse.io ships. -->
<html lang="en">
<head><meta charset="utf-8"><title>Acme Inc — Senior Engineer</title></head>
<body>
<div id="application">
  <h1>Apply for this Job</h1>
  <form id="application_form" action="/boards/acme/apply/12345" method="post" enctype="multipart/form-data">
    <input type="hidden" name="authenticity_token" value="dummy">
    <input type="hidden" name="utf8" value="&#x2713;">

    <!-- Contact -->
    <div class="field required">
      <label for="first_name">First Name<span class="required">*</span></label>
      <input id="first_name" name="job_application[first_name]" type="text" required>
    </div>
    <div class="field required">
      <label for="last_name">Last Name<span class="required">*</span></label>
      <input id="last_name" name="job_application[last_name]" type="text" required>
    </div>
    <div class="field required">
      <label for="email">Email<span class="required">*</span></label>
      <input id="email" name="job_application[email]" type="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel">
    </div>

    <!-- Resume -->
    <div class="field required">
      <label for="resume">Resume/CV<span class="required">*</span></label>
      <input id="resume" name="job_application[resume]" type="file" required>
    </div>
    <div class="field">
      <label for="cover_letter">Cover Letter</label>
      <input id="cover_letter" name="job_application[cover_letter]" type="file">
    </div>

    <!-- Links -->
    <div class="field">
      <label for="urls_linkedin">LinkedIn Profile</label>
      <input id="urls_linkedin" name="job_application[urls][LinkedIn]" type="url">
    </div>
    <div class="field">
      <label for="urls_github">GitHub URL</label>
      <input id="urls_github" name="job_application[urls][GitHub]" type="url">
    </div>
    <div class="field">
      <label for="urls_portfolio">Portfolio</label>
      <input id="urls_portfolio" name="job_application[urls][Portfolio]" type="url">
    </div>

    <!-- Location -->
    <div class="field">
      <label for="location">Current Location</label>
      <input id="location" name="job_application[location]" type="text">
    </div>

    <!-- Custom questions -->
    <div id="custom_questions">
      <div class="field required">
        <label for="q_why">Why do you want to work at Acme?<span class="required">*</span></label>
        <textarea id="q_why" name="job_application[answers_attributes][0][text_value]" required maxlength="2000"></textarea>
      </div>

      <div class="field required">
        <label class="question">Are you legally authorized to work in the United States?<span class="required">*</span></label>
        <select id="q_work_auth" name="job_application[answers_attributes][1][boolean_value]" required>
          <option value="">Please select</option>
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <div class="field required">
        <label class="question">Will you now or in the future require sponsorship for employment visa status?<span class="required">*</span></label>
        <select id="q_sponsor" name="job_application[answers_attributes][2][boolean_value]" required>
          <option value="">Please select</option>
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <div class="field">
        <label for="q_school">School</label>
        <input id="q_school" name="job_application[answers_attributes][3][text_value]" type="text">
      </div>
      <div class="field">
        <label for="q_degree">Degree</label>
        <input id="q_degree" name="job_application[answers_attributes][4][text_value]" type="text">
      </div>
      <div class="field">
        <label for="q_major">Major</label>
        <input id="q_major" name="job_application[answers_attributes][5][text_value]" type="text">
      </div>
    </div>

    <!-- EEO -->
    <div id="eeo_fields">
      <h3>Voluntary Self-Identification</h3>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="candidate[gender]">
          <option value="">Select...</option>
          <option>Male</option>
          <option>Female</option>
          <option>Non-binary</option>
          <option>Decline to self-identify</option>
        </select>
      </div>
      <div class="field">
        <label for="race">Race/Ethnicity</label>
        <select id="race" name="candidate[race]">
          <option value="">Select...</option>
          <option>Asian</option>
          <option>Black or African American</option>
          <option>Hispanic or Latino</option>
          <option>White</option>
          <option>Two or More Races</option>
          <option>Decline to self-identify</option>
        </select>
      </div>
      <div class="field">
        <label for="veteran_status">Veteran Status</label>
        <select id="veteran_status" name="candidate[veteran_status]">
          <option value="">Select...</option>
          <option>I am a protected veteran</option>
          <option>I am not a protected veteran</option>
          <option>I don't wish to answer</option>
        </select>
      </div>
      <div class="field">
        <label for="disability_status">Disability Status</label>
        <select id="disability_status" name="candidate[disability_status]">
          <option value="">Select...</option>
          <option>Yes, I have a disability</option>
          <option>No, I do not have a disability</option>
          <option>I do not wish to answer</option>
        </select>
      </div>
    </div>

    <button type="submit">Submit Application</button>
  </form>
</div>
</body>
</html>
