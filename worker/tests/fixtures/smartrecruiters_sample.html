<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Gamma Corp — Engineering Manager</title></head>
<body>
<form id="applyForm" data-test="application-form" action="/apply/123" method="post" enctype="multipart/form-data">

  <div class="field required">
    <label data-test="field-label" for="firstName">First Name *</label>
    <input id="firstName" name="firstName" type="text" required aria-required="true">
  </div>
  <div class="field required">
    <label data-test="field-label" for="lastName">Last Name *</label>
    <input id="lastName" name="lastName" type="text" required aria-required="true">
  </div>
  <div class="field required">
    <label data-test="field-label" for="email">Email *</label>
    <input id="email" name="email" type="email" required>
  </div>
  <div class="field">
    <label data-test="field-label" for="phone">Phone</label>
    <input id="phone" name="phone" type="tel">
  </div>
  <div class="field">
    <label data-test="field-label" for="linkedin">LinkedIn URL</label>
    <input id="linkedin" name="socialProfiles.linkedin" type="url" aria-label="LinkedIn Profile URL">
  </div>

  <div class="field required">
    <label data-test="field-label" for="resume">Resume *</label>
    <input id="resume" name="resume" type="file" required>
  </div>

  <div data-test="screening-questions">
    <div class="field required">
      <label data-test="field-label" for="q_auth">Are you legally authorized to work in the United States? *</label>
      <select id="q_auth" name="answers[auth]" required>
        <option value="">Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>
    </div>
    <div class="field required">
      <label data-test="field-label" for="q_spon">Do you require sponsorship for employment visa status now or in the future? *</label>
      <select id="q_spon" name="answers[sponsor]" required>
        <option value="">Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>
    </div>
    <div class="field">
      <label data-test="field-label" for="q_degree">Highest degree earned</label>
      <select id="q_degree" name="answers[degree]">
        <option value="">Select</option>
        <option>High School</option>
        <option>Bachelor's</option>
        <option>Master's</option>
        <option>PhD</option>
      </select>
    </div>
  </div>

  <button type="submit">I'm Interested</button>
</form>
</body>
</html>
